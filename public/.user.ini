; PHP2Shell (CVE-2026-109618, CVE-2026-109619): cazurile de atac știute trec prin session.upload_progress; cemainou nu-l folosește.
; Pe serverele care citesc .user.ini (PHP-FPM, LiteSpeed) îl oprește aici, fără acces la php.ini.
session.upload_progress.enabled = 0
; Performanță: OPcache verifică fișierele de cod o dată la 60 s, nu la fiecare cerere (după o actualizare, public/index.php golește cache-ul)
opcache.revalidate_freq = 60
